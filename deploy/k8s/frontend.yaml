apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wellconverge
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          # Built locally with `docker build -t wellconverge-frontend:dev ./frontend`.
          image: wellconverge-frontend:dev
          imagePullPolicy: IfNotPresent
          env:
            # Vite proxies /api to the backend Service inside the cluster's DNS.
            - name: VITE_API_TARGET
              value: http://backend:8080
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wellconverge
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - port: 5173
      targetPort: 5173
