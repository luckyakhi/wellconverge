apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wellconverge
spec:
  replicas: 1
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          # Built locally with `docker build -t wellconverge-backend:dev ./backend`.
          # Docker Desktop's Kubernetes node shares the Docker Engine's image store, so no
          # registry push is needed for this tag to resolve.
          image: wellconverge-backend:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/wellconverge
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wellconverge
spec:
  selector: { app: backend }
  ports:
    - port: 8080
      targetPort: 8080
