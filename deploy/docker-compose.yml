# WellConverge — local stack (Iteration 1): Postgres + Spring Boot backend + React frontend.
# Run from the repo root:  docker compose -f deploy/docker-compose.yml up --build
name: wellconverge

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellconverge
      POSTGRES_USER: wellconverge
      POSTGRES_PASSWORD: wellconverge
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellconverge -d wellconverge"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/wellconverge
      DB_USERNAME: wellconverge
      DB_PASSWORD: wellconverge
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ../frontend
    environment:
      # Vite proxies /api to the backend service inside the compose network.
      VITE_API_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
