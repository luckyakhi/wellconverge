[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wellconverge-tools"
version = "0.1.0"
description = "Adhoc data analysis / ML tooling for WellConverge, plus a synthetic medical dataset for AWS Glue + SageMaker catalog experiments"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "boto3>=1.34",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyterlab>=4.0", "matplotlib>=3.8"]

[project.scripts]
wc-tools = "wellconverge_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
