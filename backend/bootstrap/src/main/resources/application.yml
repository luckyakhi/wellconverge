spring:
  application:
    name: wellconverge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wellconverge}
    username: ${DB_USERNAME:wellconverge}
    password: ${DB_PASSWORD:wellconverge}
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate. Validate that the mapping matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: 8080
